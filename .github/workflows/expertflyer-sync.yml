name: ExpertFlyer Seat Map Sync

on:
  schedule:
    # Runs every 5 minutes; script throttles to 15m normally and 5m inside T-2h
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      origins:
        description: "Optional comma-separated origin IATA codes"
        required: false
        default: ""
      destinations:
        description: "Optional comma-separated destination IATA codes"
        required: false
        default: ""
      date:
        description: "Optional YYYY-MM-DD departure date"
        required: false
        default: ""
      mode:
        description: "Optional mode: avail_only or seatmap_only"
        required: false
        default: ""
      flight_key:
        description: "Optional single flight_key for seatmap_only mode"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Firefox
        run: |
          pip install playwright
          playwright install firefox

      - name: Sync watched flights from ExpertFlyer
        env:
          EXPERTFLYER_EMAIL: ${{ secrets.EXPERTFLYER_EMAIL }}
          EXPERTFLYER_PASSWORD: ${{ secrets.EXPERTFLYER_PASSWORD }}
          STANDBY_WORKER_URL: https://standby-flight-dashboard.michaelborland71.workers.dev
          EF_ORIGINS: ${{ github.event.inputs.origins }}
          EF_DESTINATIONS: ${{ github.event.inputs.destinations }}
          EF_DATE: ${{ github.event.inputs.date }}
          EF_MODE: ${{ github.event.inputs.mode }}
          EF_FLIGHT_KEY: ${{ github.event.inputs.flight_key }}
        run: python3 scripts/sync_expertflyer.py
